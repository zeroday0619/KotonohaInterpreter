# Configuration for the services running ON the RTX A6000, not on the Orin.
#
# Only the model sections matter here. perf_mode, placement and remote are the
# orchestrator's business; a service does not know or care where its caller is.
#
# The A6000 profile uses fp16 ASR verification and TranslateGemma.
# Deployment acceptance requires measurements on this host.

accelerator:
  profile: nvidia.rtx.a6000

asr:
  backend: vllm
  model_id: /models/Qwen3-ASR-0.6B-hf
  vllm_model_id: /models/Voxtral-Mini-4B-Realtime-2602
  vllm_served_model_name: kotonoha-asr
  vllm_realtime_architecture: voxtral
  dtype: bfloat16
  # A measured 0.20 allocation left 0.41 GiB for a 3.27 GiB KV-cache requirement.
  # Keep headroom above the derived 0.261 minimum and remeasure concurrent residency.
  vllm_gpu_memory_utilization: 0.28
  vllm_max_model_len: 4096
  vllm_enforce_eager: true
  n_best: 5
  num_beams: 5
  timeout_s: 6.0 # includes the upload; the client also has its own timeout

asr_verify:
  enabled: true
  backend: faster_whisper
  model_id: /models/faster-whisper-large-v3
  # int8_float16 was a bandwidth concession on the Orin. Not needed here.
  compute_type: float16
  device: cuda
  beam_size: 5
  timeout_s: 5.0

llm:
  profile: translategemma
  profiles:
    translategemma:
      repo: google/translategemma-12b-it
      directory: translategemma-12b-it
      quantization: null
      dtype: bfloat16
  models_dir: /models/llm
  max_model_len: 2048
  max_tokens: 768

# Unused by the services, but the config schema requires them.
store:
  path: /tmp/kotonoha-remote.db
logging:
  level: INFO
  log_path: /tmp/kotonoha-remote.jsonl
  turn_log_path: /tmp/kotonoha-remote-turns.jsonl
  console: true
