# Initial glossary seed. Load with `kotonoha glossary import config/glossary.seed.yaml`.
#
# §5, pinning Taiwanese vocabulary: left alone, the translation LLM takes the
# Mainland words (软件/视频/信息/鼠标) and merely converts the glyphs, producing
# 軟件/視頻/信息/鼠標. That reads wrong to a Taiwanese speaker.
# src_lang: '*' applies to every source language.

glossary:
  # --- Taiwanese vocabulary: each source language -> zh-TW ---
  - { src_lang: en, src_term: software, tgt_lang: zh-TW, tgt_term: 軟體, kind: vocab, priority: 10 }
  - { src_lang: en, src_term: video, tgt_lang: zh-TW, tgt_term: 影片, kind: vocab, priority: 10 }
  - { src_lang: en, src_term: information, tgt_lang: zh-TW, tgt_term: 資訊, kind: vocab, priority: 10 }
  - { src_lang: en, src_term: mouse, tgt_lang: zh-TW, tgt_term: 滑鼠, kind: vocab, priority: 10, note: "the pointing device" }
  - { src_lang: en, src_term: network, tgt_lang: zh-TW, tgt_term: 網路, kind: vocab, priority: 10 }
  - { src_lang: en, src_term: program, tgt_lang: zh-TW, tgt_term: 程式, kind: vocab, priority: 10 }
  - { src_lang: en, src_term: printer, tgt_lang: zh-TW, tgt_term: 印表機, kind: vocab, priority: 10 }
  - { src_lang: en, src_term: hard disk, tgt_lang: zh-TW, tgt_term: 硬碟, kind: vocab, priority: 10 }

  - { src_lang: ko, src_term: 소프트웨어, tgt_lang: zh-TW, tgt_term: 軟體, kind: vocab, priority: 10 }
  - { src_lang: ko, src_term: 영상, tgt_lang: zh-TW, tgt_term: 影片, kind: vocab, priority: 10 }
  - { src_lang: ko, src_term: 정보, tgt_lang: zh-TW, tgt_term: 資訊, kind: vocab, priority: 10 }
  - { src_lang: ko, src_term: 마우스, tgt_lang: zh-TW, tgt_term: 滑鼠, kind: vocab, priority: 10 }
  - { src_lang: ko, src_term: 네트워크, tgt_lang: zh-TW, tgt_term: 網路, kind: vocab, priority: 10 }
  - { src_lang: ko, src_term: 프로그램, tgt_lang: zh-TW, tgt_term: 程式, kind: vocab, priority: 10 }
  - { src_lang: ko, src_term: 프린터, tgt_lang: zh-TW, tgt_term: 印表機, kind: vocab, priority: 10 }

  - { src_lang: ja, src_term: ソフトウェア, tgt_lang: zh-TW, tgt_term: 軟體, kind: vocab, priority: 10 }
  - { src_lang: ja, src_term: 動画, tgt_lang: zh-TW, tgt_term: 影片, kind: vocab, priority: 10 }
  - { src_lang: ja, src_term: 情報, tgt_lang: zh-TW, tgt_term: 資訊, kind: vocab, priority: 10 }
  - { src_lang: ja, src_term: マウス, tgt_lang: zh-TW, tgt_term: 滑鼠, kind: vocab, priority: 10 }
  - { src_lang: ja, src_term: ネットワーク, tgt_lang: zh-TW, tgt_term: 網路, kind: vocab, priority: 10 }
  - { src_lang: ja, src_term: プログラム, tgt_lang: zh-TW, tgt_term: 程式, kind: vocab, priority: 10 }

# Applied after OpenCC s2twp, to catch cases where the glyphs converted but the
# vocabulary did not.
zh_rules:
  - { pattern: 軟件, replacement: 軟體, note: "a case s2twp misses" }
  - { pattern: 視頻, replacement: 影片 }
  - { pattern: 鼠標, replacement: 滑鼠 }
  - { pattern: 網絡, replacement: 網路 }
  - { pattern: 打印機, replacement: 印表機 }
  - { pattern: 硬盤, replacement: 硬碟 }
  - { pattern: 內存, replacement: 記憶體 }
  - { pattern: 質量, replacement: 品質, note: "quality, not physical mass" }
