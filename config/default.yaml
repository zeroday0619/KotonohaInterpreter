# Kotonoha Interpreter — 기본 설정
#
# Phase 0 스파이크 결과로 확정해야 하는 항목에는 [SPIKE-n] 표시를 달아두었다.
# 스파이크 결과가 나오기 전까지는 보수적인 쪽(transformers, dense, melo)을 기본값으로 둔다.

session:
  mode: push_to_talk # push_to_talk | auto   (§4: 초기 구현은 PTT)
  routing: pair # pair | fixed | broadcast (§9 Phase 4)
  pair: [ko, en]
  fixed_target: en
  broadcast_targets: [ko, en, zh-TW, ja]
  languages: [ko, en, zh-TW, ja]

audio:
  input_device: null # null = 시스템 기본. `kotonoha devices`로 확인
  output_device: null
  capture_sample_rate: 48000
  capture_block_ms: 20
  channels: 1
  work_sample_rate: 16000 # ASR/VAD 작업 레이트
  playback_sample_rate: 24000 # TTS 출력 레이트

frontend:
  denoise:
    enabled: true
    backend: deepfilternet3 # deepfilternet3 | none
    post_filter_beta: 0.02
  vad:
    backend: silero_onnx # energy = 개발 PC 폴백 전용
    model_path: ./models/silero_vad.onnx
    threshold: 0.5
    neg_threshold: 0.35 # 히스테리시스
    # [타협 불가 §5.1] 프리롤이 없으면 한국어 초성 파열음/일본어 촉음이 잘린다.
    preroll_ms: 300
    min_speech_ms: 120
    silence_ms: 800 # EOU 판정
    max_utterance_ms: 30000
    frame_ms: 32 # silero v5는 16kHz에서 512 sample(32ms) 창

shm:
  name: kotonoha_audio # POSIX shm 이름 (§3: 오디오는 HTTP body에 태우지 않는다)
  slots: 8
  slot_seconds: 30
  sample_rate: 16000

services:
  asr: http://127.0.0.1:8001
  asr_verify: http://127.0.0.1:8002
  llm: http://127.0.0.1:8003
  tts: http://127.0.0.1:8004

asr:
  # [SPIKE-1] vLLM이 Qwen3-ASR을 로드하면 backend: vllm 으로 전환
  backend: transformers # transformers | vllm
  model_id: Qwen/Qwen3-ASR-1.7B-hf
  vllm_model_id: Qwen/Qwen3-ASR-1.7B
  dtype: float16
  # [타협 불가 §5.2] 순차식이므로 그리디를 쓸 이유가 없다
  n_best: 5
  num_beams: 5
  max_new_tokens: 256
  timeout_s: 4.0
  # 평균 로그확률이 이 값 미만이면 교차 검증 발동 (§5.5)
  avg_logprob_threshold: -0.55
  lid:
    min_confidence: 0.60
    min_duration_s: 1.0 # 미만이면 직전 언어 승계 (§5, §10)

asr_verify:
  enabled: true
  backend: faster_whisper # faster_whisper | whisper_cpp
  model_id: large-v3
  compute_type: int8_float16
  device: cuda
  beam_size: 5
  timeout_s: 3.0
  # 두 가설의 문자 오류율 차이가 이 값 이상이면 LLM에 둘 다 넘긴다
  divergence_cer: 0.25

llm:
  # [SPIKE-3] 실측 tok/s가 5.0 미만이면 profile: dense 로 회귀
  profile: dense # moe | dense
  profiles:
    moe:
      repo: unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF
      file: Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf
      n_gpu_layers: -1
    dense:
      repo: unsloth/Qwen3-14B-GGUF
      file: Qwen3-14B-Q4_K_M.gguf
      n_gpu_layers: -1
  models_dir: ./models/gguf
  n_ctx: 2048
  n_batch: 512
  temperature: 0.2
  top_p: 0.9
  repeat_penalty: 1.05
  max_tokens: 512
  stream: true
  timeout_s: 3.0 # §10: 초과 시 원문 전사만 표시하고 TTS 생략
  # §5.4 절 단위 스트리밍 성립 조건. 미달이면 경고 로그.
  min_tok_per_s: 5.0

tts:
  # [SPIKE-2] flash-attn 없이 Qwen3-TTS가 뜨면 backend: qwen3
  backend: melo # qwen3 | melo
  model_id: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
  sample_rate: 24000
  chunk_ms: 200
  timeout_s: 5.0
  fallback: melo # §10
  # Qwen3-TTS CustomVoice 의 프리셋 음색 이름 (Vivian / Ryan / Aiden 등 9종)
  voices:
    ko: Vivian
    en: Vivian
    zh-TW: Vivian
    ja: Vivian
  melo_speakers:
    ko: KR
    en: EN-US
    zh-TW: ZH
    ja: JP

zh:
  opencc_config: s2twp # 간체 → 번체(대만 관용) (§5)
  apply_to: [asr, translation]

context:
  history_turns: 6 # §3
  glossary_max_terms: 64 # 프롬프트 프리픽스로만 주입. 벡터DB 금지(§12)

store:
  path: ./data/kotonoha.db

logging:
  level: INFO
  log_path: ./data/logs/kotonoha.jsonl # 애플리케이션 로그
  turn_log_path: ./data/logs/turns.jsonl # §11 턴 메트릭 (한 줄 = 한 턴)
  console: false # TUI가 화면을 점유하므로 기본 off

# §6 지연 예산(ms). 초과 단계는 turn 로그에 over_budget으로 표시된다.
budget_ms:
  silence: 800
  frontend: 100
  asr: 900
  verify: 100
  llm_first_clause: 700
  tts_first_packet: 300
  total: 2900
