# Kotonoha Interpreter — default configuration
#
# Settings that Phase 0 has to decide are marked [SPIKE-n]. ASR now uses the
# vLLM runtime by default; target measurements still decide deployment acceptance.

# Accelerator identity selects a profile from config/profiles/accelerators.
# Profile identifiers use <vendor>.<family>.<model> naming.
accelerator:
  profile: nvidia.jetson.agx-orin

session:
  mode: push_to_talk # push_to_talk | auto | text   (§4: start with PTT)
  # Source language for typed input. auto reads it from the script.
  text_source_language: auto # auto | ko | en | zh-TW | ja
  routing: pair # pair | fixed | broadcast (§9, Phase 4)
  pair: [ko, en]
  fixed_target: en
  broadcast_targets: [ko, en, zh-TW, ja]
  languages: [ko, en, zh-TW, ja]

audio:
  input_device: null # null = system default. Check with `kotonoha devices`.
  output_device: null
  capture_sample_rate: 48000
  capture_block_ms: 20
  channels: 1
  work_sample_rate: 16000 # working rate for ASR and VAD
  playback_sample_rate: 24000 # TTS output rate

frontend:
  denoise:
    enabled: true
    backend: deepfilternet3 # deepfilternet3 | none
    post_filter_beta: 0.02
  vad:
    backend: silero_onnx # "energy" is a development-machine fallback only
    model_path: ./models/silero_vad.onnx
    threshold: 0.5
    neg_threshold: 0.35 # hysteresis
    # [non-negotiable, §5.1] Without preroll, Korean tense-stop onsets and the
    # pause before a Japanese sokuon get clipped.
    preroll_ms: 300
    min_speech_ms: 120
    silence_ms: 800 # end-of-utterance
    max_utterance_ms: 30000
    frame_ms: 32 # silero v5 uses a 512-sample (32 ms) window at 16 kHz

shm:
  name: kotonoha_audio # POSIX shm name (§3: audio never rides in an HTTP body)
  slots: 8
  slot_seconds: 30
  sample_rate: 16000

services:
  asr: http://127.0.0.1:8001
  asr_verify: http://127.0.0.1:8002
  llm: http://127.0.0.1:8003
  tts: http://127.0.0.1:8004

# --- High-performance mode: the external RTX A6000 -------------------------
#
#   onboard  everything on the Orin. The original design.
#   hybrid   only the LLM goes to the A6000. It is text-only, so audio remains
#            on the device.
#   remote   ASR, verification and TTS also move to the external server.
#            Utterance audio crosses the network.
#
# Run `kotonoha netcheck` before trusting any of this: the link adds RTT to
# every stage, and §6 has no slack for a bad one.
perf_mode: onboard # onboard | hybrid | remote
placement: {} # per-role override, e.g. {llm: remote}

remote:
  enabled: false
  services:
    asr: http://a6000.lan:8001
    asr_verify: http://a6000.lan:8002
    llm: http://a6000.lan:8003
    tts: http://a6000.lan:8004
  token: null # bearer token; prefer KOTONOHA__REMOTE__TOKEN
  verify_tls: true
  ca_bundle: null
  connect_timeout_s: 1.5
  # §10 applied to the link: after this many consecutive transport failures the
  # role drops to the on-board service, and only returns once the remote has
  # been healthy for recover_after_s.
  failover_after: 2
  recover_after_s: 30.0
  health_interval_s: 10.0
  audio_encoding: s16le # s16le halves the bytes on the wire; f32le for debugging

asr:
  # [SPIKE-1] vLLM is the primary runtime. Transformers remains an explicit fallback.
  backend: vllm # vllm | transformers
  # Jetson uses the compact Qwen checkpoint. The A6000 overlay selects Voxtral.
  model_id: Qwen/Qwen3-ASR-0.6B-hf
  vllm_model_id: Qwen/Qwen3-ASR-0.6B
  vllm_served_model_name: kotonoha-asr
  # qwen3_asr applies the realtime architecture override required by vLLM.
  vllm_realtime_architecture: qwen3_asr # qwen3_asr | voxtral
  dtype: float16
  # The ASR and translation vLLM engines share one GPU. Spike measurements must
  # validate this provisional split before deployment acceptance.
  vllm_gpu_memory_utilization: 0.25
  vllm_max_model_len: 4096
  # Eager mode avoids target-specific CUDA graph failures during initial deployment.
  vllm_enforce_eager: true
  # [non-negotiable, §5.2] Consecutive interpreting: no reason to decode greedily.
  n_best: 5
  num_beams: 5
  max_new_tokens: 256
  timeout_s: 4.0
  # Below this average log-probability, cross-verification fires (§5.5).
  avg_logprob_threshold: -0.55
  lid:
    min_confidence: 0.60
    min_duration_s: 1.0 # shorter than this inherits the previous language (§5, §10)

asr_verify:
  enabled: true
  # §5.5 makes this conditional because it costs 0.8 s on the Orin. Remote
  # deployments can select always after measuring the external service.
  mode: conditional # conditional | always
  backend: faster_whisper # faster_whisper | whisper_cpp
  model_id: large-v3
  # The published AArch64 CTranslate2 artifact lacks CUDA support. Keep the
  # Jetson baseline on the supported CPU path until a CUDA build is validated.
  compute_type: int8
  device: cpu
  beam_size: 5
  timeout_s: 3.0
  # If the two hypotheses differ by at least this CER, hand both to the LLM.
  divergence_cer: 0.25

llm:
  # Jetson uses 4B. The remote service overlay replaces this snapshot with 12B.
  # Spike 3 must verify generation rate and one-pass ASR correction on each target.
  profile: translategemma
  profiles:
    translategemma:
      repo: google/translategemma-4b-it
      directory: translategemma-4b-it
      quantization: null
      dtype: bfloat16
  models_dir: ./models/llm
  served_model_name: kotonoha-translation
  max_model_len: 2048
  temperature: 0.0
  top_p: 1.0
  repetition_penalty: 1.0
  max_tokens: 512
  stream: true
  timeout_s: 3.0 # §10: on timeout, show the transcript only and skip TTS
  # §5.4 precondition for clause streaming. Lower rates produce a warning.
  min_tok_per_s: 5.0

tts:
  # vLLM-Omni serves the offline CustomVoice snapshot through /v1/audio/speech.
  backend: vllm_omni
  served_model_name: kotonoha-tts
  task_type: CustomVoice
  sample_rate: 24000
  timeout_s: 5.0
  # Qwen3-TTS CustomVoice presets, constrained to each voice's native language.
  voices:
    ko: Sohee # Warm Korean female voice.
    en: Ryan # Dynamic English male voice with rhythm; Aiden is also available.
    ja: Ono_Anna # Playful Japanese female voice.
    # Vivian, Serena, Uncle_Fu, Dylan, and Eric are available for Chinese.
    zh_tw: Vivian

zh:
  opencc_config: s2twp # Simplified -> Traditional with Taiwanese usage (§5)
  apply_to: [asr, translation]

ui:
  # auto follows KOTONOHA_LANG, then the system locale, then English.
  language: auto # auto | en | ko | ja | zh-TW
  # Past turns shown as messages below the live panes. 0 hides the panel; `h`
  # toggles it at runtime.
  history_turns: 20
  refresh_hz: 60 # idle frames do not trigger terminal repaint

context:
  history_turns: 6 # §3
  glossary_max_terms: 64 # injected as a prompt prefix only; no vector DB (§12)

store:
  path: ./data/kotonoha.db

logging:
  level: INFO
  log_path: ./data/logs/kotonoha.jsonl # application log
  turn_log_path: ./data/logs/turns.jsonl # §11 turn metrics, one line per turn
  console: true # rendered as structured records in the TUI; raw JSON in service consoles
  prometheus_port: null # optional localhost receiver for unified metrics, for example 9091

# §6 latency budget in ms. Stages that exceed it appear in the turn log as over_budget.
budget_ms:
  silence: 800
  frontend: 100
  asr: 900
  verify: 100
  llm_first_clause: 700
  tts_first_packet: 300
  total: 2900
