# High-performance mode: the Orin drives audio, the RTX A6000 does the work.
#
#   kotonoha -c config/performance.yaml netcheck
#   kotonoha -c config/performance.yaml run
#
# Copy to config/local.yaml (or point KOTONOHA_CONFIG at it) once netcheck says
# the link holds. Everything here is layered on config/default.yaml.
#
# Before switching: run `kotonoha netcheck`. Every remote stage pays the RTT,
# and §6 leaves no slack for a link that does not hold.

perf_mode: remote # hybrid keeps audio on the device; remote is the fast one

remote:
  enabled: true
  services:
    asr: http://a6000.lan:8001
    asr_verify: http://a6000.lan:8002
    llm: http://a6000.lan:8003
    tts: http://a6000.lan:8004
  # Set KOTONOHA__REMOTE__TOKEN in the environment rather than committing one.
  token: null
  verify_tls: true
  failover_after: 2
  recover_after_s: 30.0
  audio_encoding: s16le

# The remote translation profile is configured independently from the Jetson
# profile. Target-host measurements remain required for deployment acceptance.
llm:
  profile: moe
  n_ctx: 4096 # room for six turns of history plus the glossary
  max_tokens: 768

asr:
  # Run Spike 1 on the A6000 before switching this away from transformers.
  backend: transformers
  n_best: 5

asr_verify:
  # Remote mode verifies every turn. Measure the added latency during acceptance.
  mode: always
  compute_type: float16 # int8 was an Orin memory-bandwidth concession

tts:
  # The remote image build requires flash-attn. The health endpoint reports the
  # attention implementation loaded by Qwen3-TTS.
  backend: qwen3

# Deliberately unchanged: VAD preroll, the 800 ms EOU wait and the clause
# streaming thresholds. Those are frontend properties and the frontend still
# runs on the Orin.
