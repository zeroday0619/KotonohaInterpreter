[project]
name = "kotonoha-interpreter"
version = "0.1.0"
description = "Consecutive (non-simultaneous) 4-language offline speech interpreter for Jetson AGX Orin"
readme = "README.md"
license = { file = "LICENSE" }
# The selected Jetson r36.4 service image provides Python 3.10. The JetPack 7.2
# host and A6000 service images use Python 3.12.
requires-python = ">=3.10"

dependencies = [
  # The NGC A6000 runtime ships SciPy and scikit-learn builds for NumPy 2,
  # while Jetson device dependencies and workstation evaluation still require NumPy 1.
  "numpy>=2,<2.3 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "numpy>=1.24,<2 ; sys_platform != 'linux' or platform_machine != 'x86_64'",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "structlog>=24.1",
  "textual>=0.79",
  "rich>=13.7",
  "typer>=0.12",
  "soxr>=0.5",
  "sounddevice>=0.4.7",
  "opencc-python-reimplemented>=0.1.7",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  # Multipart parsing for the /transcribe/upload path used in remote mode.
  "python-multipart>=0.0.9",
  "uvloop>=0.22.1,<0.23",
  "websockets>=14,<17",
]

# Device-only dependencies. Phase 0 verifies aarch64 wheel availability on the
# Jetson. Do not install this extra on macOS.
#
# This extra keeps Jetson-only inference packages out of the workstation and
# A6000 runtime environments.
[project.optional-dependencies]
device = [
  "onnxruntime>=1.18 ; sys_platform == 'linux' and platform_machine == 'aarch64'",          # silero-vad
  "deepfilternet>=0.5.6 ; sys_platform == 'linux' and platform_machine == 'aarch64'",       # DeepFilterNet3
  "faster-whisper>=1.0.3 ; sys_platform == 'linux' and platform_machine == 'aarch64'",      # CTranslate2 backend
  "transformers>=4.57 ; sys_platform == 'linux' and platform_machine == 'aarch64'",         # Qwen3-ASR Transformers fallback
  "accelerate>=0.33 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "soundfile>=0.12 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# Verification ASR runs in one project environment on both inference hosts.
asr-verify = [
  "faster-whisper>=1.0.3",
  "soundfile>=0.12",
]
# Voxtral uses vLLM for inference, but its Mistral tokenizer and audio
# preprocessing require the audio features supplied by mistral-common. Keep
# this target-specific so the Jetson Qwen3-ASR image does not install it.
a6000-asr = [
  "mistral-common[audio]>=1.11.3",
  "nvidia-cufft>=12,<13 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
]

# Development-only tools use a PEP 735 dependency group so they do not enter
# deployment artifacts.
[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "jiwer>=3.0",
  "babel>=2.14",
]
# Evaluation runs on the development workstation. COMET does not run on the Orin.
eval = [
  "jiwer>=3.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "unbabel-comet>=2.2 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "pandas>=2.2 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
[project.scripts]
kotonoha = "kotonoha._cli:main"

[build-system]
# Babel compiles the translation catalogs in hatch_build.py. .po files are
# committed; .mo files are generated at install time and never committed.
requires = ["hatchling", "babel>=2.14"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kotonoha"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
# `uv sync` installs development tools by default. Add `--group eval` for evaluation.
default-groups = ["dev"]
# Hardware spikes obtain vLLM from target-specific CUDA container images.
# Keep the lock scoped to the development workstation and both deployment architectures.
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID252"]
ignore = ["B008"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
