[project]
name = "kotonoha-interpreter"
version = "0.1.0"
description = "Consecutive (non-simultaneous) 4-language offline speech interpreter for Jetson AGX Orin"
readme = "README.md"
license = { file = "LICENSE" }
# JetPack 6.2 containers provide Python 3.10. Development workstations can use
# newer interpreters, but source syntax must remain compatible with Python 3.10.
requires-python = ">=3.10"

dependencies = [
  "numpy>=1.24,<2.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "structlog>=24.1",
  "textual>=0.79",
  "rich>=13.7",
  "typer>=0.12",
  "soxr>=0.5",
  "sounddevice>=0.4.7",
  "opencc-python-reimplemented>=0.1.7",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  # Multipart parsing for the /transcribe/upload path used in remote mode.
  "python-multipart>=0.0.9",
  "uvloop>=0.22.1,<0.23",
]

# Device-only dependencies. Phase 0 verifies aarch64 wheel availability on the
# Jetson. Do not install this extra on macOS.
#
# This is an extra because device containers install it into the system Python
# with `uv pip install --system -e ".[device]"`. That preserves the Torch and
# CUDA builds supplied by the base image.
[project.optional-dependencies]
device = [
  "onnxruntime>=1.18",          # silero-vad
  "deepfilternet>=0.5.6",       # DeepFilterNet3
  "faster-whisper>=1.0.3",      # CTranslate2 backend
  "transformers>=4.57",         # Qwen3-ASR / Qwen3-TTS
  "accelerate>=0.33",
  "soundfile>=0.12",
]

# Development-only tools use a PEP 735 dependency group so they do not enter
# deployment artifacts.
[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "jiwer>=3.0",
  "babel>=2.14",
]
# Evaluation runs on the development workstation. COMET does not run on the Orin.
eval = [
  "jiwer>=3.0",
  "unbabel-comet>=2.2",
  "pandas>=2.2",
]
spike-vllm = [
  "vllm==0.24.0 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
]

[project.scripts]
kotonoha = "kotonoha._cli:main"

[build-system]
# Babel compiles the translation catalogs in hatch_build.py. .po files are
# committed; .mo files are generated at install time and never committed.
requires = ["hatchling", "babel>=2.14"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kotonoha"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
# `uv sync` installs development tools by default. Add `--group eval` for evaluation.
default-groups = ["dev"]
# The PyPI vLLM runtime conflicts with the device audio stack and COMET.
# Target images obtain their resident vLLM from the CUDA base image, while
# source-based A6000 spike runs activate the dedicated dependency group.
conflicts = [
  [
    { group = "spike-vllm" },
    { extra = "device" },
  ],
  [
    { group = "spike-vllm" },
    { group = "eval" },
  ],
]
# Keep the lock scoped to the development workstation and both deployment architectures.
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID252"]
ignore = ["B008"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
