[project]
name = "kotonoha-interpreter"
version = "0.1.0"
description = "Consecutive (non-simultaneous) 4-language offline speech interpreter for Jetson AGX Orin"
readme = "README.md"
license = { file = "LICENSE" }
# The selected Jetson r36.4 service image provides Python 3.10. The JetPack 7.2
# host and A6000 service images use Python 3.12.
requires-python = ">=3.10"

dependencies = [
  # The NumPy split follows the Python generation of each runtime image, not the
  # CPU architecture. vllm-omni serves TTS on BOTH hosts (Python 3.12, NumPy 2),
  # so an architecture marker breaks the Jetson TTS build. Python 3.10 identifies
  # the Jetson r36.4 vLLM images, whose torch stack requires NumPy 1; every
  # Python >= 3.11 Linux image (NGC vLLM, vllm-omni, pytorch 2.6) ships NumPy 2.
  # The macOS workstation keeps NumPy 1 for the evaluation stack.
  "numpy>=2,<2.3 ; sys_platform == 'linux' and python_full_version >= '3.11'",
  "numpy>=1.24,<2 ; sys_platform != 'linux' or python_full_version < '3.11'",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "structlog>=24.1",
  "textual>=0.79",
  "rich>=13.7",
  "typer>=0.12",
  "soxr>=0.5",
  "sounddevice>=0.4.7",
  "opencc-python-reimplemented>=0.1.7",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  # Multipart parsing for the /transcribe/upload path used in remote mode.
  "python-multipart>=0.0.9",
  "uvloop>=0.22.1,<0.23",
  "websockets>=14,<17",
]

# Device-only dependencies for the Jetson r36.4 vLLM images, which provide Python
# 3.10. The Python bound is load-bearing, not cosmetic: DeepFilterNet3 requires
# NumPy 1, so without it this extra injects `numpy<2` into the Python 3.12 split
# that the vllm-omni TTS image resolves, and the lock becomes unsatisfiable.
# Phase 0 verifies aarch64 wheel availability. Do not install this extra on macOS.
#
# This extra keeps Jetson-only inference packages out of the workstation and
# A6000 runtime environments.
[project.optional-dependencies]
device = [
  "onnxruntime>=1.18 ; sys_platform == 'linux' and platform_machine == 'aarch64' and python_full_version < '3.11'",          # silero-vad
  "deepfilternet>=0.5.6 ; sys_platform == 'linux' and platform_machine == 'aarch64' and python_full_version < '3.11'",       # DeepFilterNet3
  "faster-whisper>=1.0.3 ; sys_platform == 'linux' and platform_machine == 'aarch64' and python_full_version < '3.11'",      # CTranslate2 backend
  "transformers>=4.57 ; sys_platform == 'linux' and platform_machine == 'aarch64' and python_full_version < '3.11'",         # Qwen3-ASR Transformers fallback
  "accelerate>=0.33 ; sys_platform == 'linux' and platform_machine == 'aarch64' and python_full_version < '3.11'",
  "soundfile>=0.12 ; sys_platform == 'linux' and platform_machine == 'aarch64' and python_full_version < '3.11'",
]
# Verification ASR runs in one project environment on both inference hosts.
asr-verify = [
  "faster-whisper>=1.0.3",
  "soundfile>=0.12",
]
# Voxtral uses vLLM for inference, but its Mistral tokenizer and audio
# preprocessing require the audio features supplied by mistral-common. Keep
# this target-specific so the Jetson Qwen3-ASR image does not install it.
a6000-asr = [
  "mistral-common[audio]>=1.11.3",
  "nvidia-cufft>=12,<13 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
]

# Development-only tools use a PEP 735 dependency group so they do not enter
# deployment artifacts.
[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "jiwer>=3.0",
  "babel>=2.14",
]
# Evaluation runs on the development workstation. COMET does not run on the Orin.
eval = [
  "jiwer>=3.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "unbabel-comet>=2.2 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "pandas>=2.2 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
[project.scripts]
kotonoha = "kotonoha._cli:main"

[build-system]
# Babel compiles the translation catalogs in hatch_build.py. .po files are
# committed; .mo files are generated at install time and never committed.
requires = ["hatchling", "babel>=2.14"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kotonoha"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
# `uv sync` installs development tools by default. Add `--group eval` for evaluation.
default-groups = ["dev"]
# onnxruntime 1.24 and later publish no cp310 wheels, although their metadata
# still admits Python 3.10. faster-whisper pulls onnxruntime transitively, and the
# Jetson vLLM base image is Ubuntu 22.04 with Python 3.10, so the resolver has to
# stay on the last release that ships cp310 aarch64 wheels (1.23.2). Remove this
# once that image moves to Python 3.11 or later.
constraint-dependencies = [
  "onnxruntime<1.24 ; python_full_version < '3.11'",
]
# Hardware spikes obtain vLLM from target-specific CUDA container images.
# Keep the lock scoped to the development workstation and both deployment architectures.
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID252"]
ignore = ["B008"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
