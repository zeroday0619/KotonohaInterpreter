# Kotonoha — browser interface.
#
# This is an overlay for either resident-service stack. The browser orchestrator
# contains no CUDA runtime and runs unchanged on Jetson, A6000, and CPU hosts:
#
#   docker compose -f docker/compose.yaml -f docker/compose.web.yaml up -d web
#   bash scripts/manage.sh web
#
# Audio belongs to the browser here. The client captures with getUserMedia and
# plays synthesized speech through Web Audio, so this container needs no /dev/snd
# and no audio group: the host's own microphone and speaker are not involved.
#
# Two properties are load-bearing:
#
#   network_mode: host   Each session reaches the model services at
#                        127.0.0.1:800x, which only resolves to them when the
#                        container shares the host network stack. `ports:` is
#                        ignored under host networking, so the listening address
#                        comes from the command below rather than a port mapping.
#
#   ipc: host            Every session publishes utterances into its own POSIX
#                        shared-memory ring that the model services read (§3).
#
# KOTONOHA_WEB_HOST is loopback by default. Browser audio only reaches the device
# over the network, and the interface carries no authentication of its own, so
# exposing it is an explicit operator decision:
#
#   KOTONOHA_WEB_HOST=0.0.0.0 bash scripts/manage.sh web
#
# Browsers refuse getUserMedia on an insecure origin other than localhost, so a
# remote listener needs HTTPS from a reverse proxy in front of this port.
#
# KOTONOHA_WEB_SESSIONS caps concurrent sessions. They share the resident model
# services, so raising it trades per-turn latency for more simultaneous speakers.

name: kotonohainterpreter

services:
  web:
    image: kotonohainterpreter-web
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ipc: host
    network_mode: host
    restart: unless-stopped
    depends_on: [asr, asr-verify, llm, tts]
    environment:
      - KOTONOHA_ENV_FILE=
      - KOTONOHA_CONFIG=${KOTONOHA_WEB_CONFIG:-/app/config/default.yaml}
      - KOTONOHA_LOCAL_CONFIG=${KOTONOHA_WEB_LOCAL_CONFIG:-/app/config/local.yaml}
      - KOTONOHA__ACCELERATOR__PROFILE=${ACCELERATOR_PROFILE:-nvidia.jetson.agx-orin}
      - HF_HOME=/models/hf
      - TRANSFORMERS_OFFLINE=1 # fully offline (§1); models are fetched in advance
      - HF_HUB_OFFLINE=1
    volumes:
      - ../config:/app/config
      - ${MODELS_DIR:-../models}:/models
      - ../data:/app/data
    command:
      - python3
      - -m
      - kotonoha
      - web
      - --host
      - ${KOTONOHA_WEB_HOST:-127.0.0.1}
      - --port
      - ${KOTONOHA_WEB_PORT:-8080}
      - --sessions
      - ${KOTONOHA_WEB_SESSIONS:-4}
