# Kotonoha — service split (§3)
#
# Two things matter here:
#   ipc: host          the shared-memory audio ring needs /dev/shm shared across
#                      process boundaries. Without it the audio would have to go
#                      into an HTTP body, costing 100-200 ms per turn.
#   network_mode: host  127.0.0.1:800x means the same thing inside and out.
#
# The NVIDIA 26.07 image provides one amd64 and one arm64 runtime. Its arm64
# variant uses CUDA 13.3 and remains subject to sm_87 validation on the
# Jetson Linux 39.2 host.

name: kotonohainterpreter

x-jetson: &jetson
  runtime: nvidia
  ipc: host
  network_mode: host
  restart: unless-stopped
  environment:
    - KOTONOHA_CONFIG=/app/config/default.yaml
    - HF_HOME=/models/hf
    - TRANSFORMERS_OFFLINE=1 # fully offline (§1); models are fetched in advance
    - HF_HUB_OFFLINE=1
  volumes:
    - ../:/app
    - ../models:/models
    - ../data:/app/data
  working_dir: /app

services:
  asr:
    <<: *jetson
    build:
      context: ..
      dockerfile: docker/Dockerfile.asr
      args:
        BASE_IMAGE: ${ASR_BASE:-nvcr.io/nvidia/vllm:26.07-py3}
        NVML_BYPASS: ${JETSON_NVML_BYPASS:-0}
    command: uvicorn kotonoha.services._asr_server:app --host 0.0.0.0 --port 8001 --loop uvloop

  asr-verify:
    <<: *jetson
    build:
      context: ..
      dockerfile: docker/Dockerfile.asr-verify
      args:
        BASE_IMAGE: ${VERIFY_BASE:-nvcr.io/nvidia/vllm:26.07-py3}
        NVML_BYPASS: ${JETSON_NVML_BYPASS:-0}
    command: uvicorn kotonoha.services._asr_verify_server:app --host 0.0.0.0 --port 8002 --loop uvloop

  llm:
    <<: *jetson
    image: kotonohainterpreter-llm
    build:
      context: ..
      dockerfile: docker/Dockerfile.llm
      args:
        BASE_IMAGE: ${LLM_IMAGE:-nvcr.io/nvidia/vllm:26.07-py3}
        NVML_BYPASS: ${JETSON_NVML_BYPASS:-0}
    environment:
      - KOTONOHA_CONFIG=/app/config/default.yaml
      - KOTONOHA__LLM__MODELS_DIR=/models/llm
      - HF_HOME=/models/hf
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1
      - KOTONOHA__LLM__MAX_MODEL_LEN=${LLM_MAX_MODEL_LEN:-2048}
      - KOTONOHA__LLM__GPU_MEMORY_UTILIZATION=${LLM_GPU_MEMORY_UTILIZATION:-0.55}
    command: uvicorn kotonoha.services._llm_server:app --host 0.0.0.0 --port 8003 --loop uvloop

  tts:
    <<: *jetson
    image: kotonohainterpreter-tts
    build:
      context: ..
      dockerfile: docker/Dockerfile.tts
      args:
        BASE_IMAGE: ${TTS_IMAGE:-vllm/vllm-omni:v0.26.0}
        NVML_BYPASS: ${JETSON_NVML_BYPASS:-0}
    environment:
      - KOTONOHA_CONFIG=/app/config/default.yaml
      - HF_HOME=/models/hf
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1
      - TTS_MODEL=/models/Qwen3-TTS-0.6B
      - TTS_SERVED_MODEL_NAME=kotonoha-tts
      - TTS_GPU_MEMORY_UTILIZATION=${TTS_GPU_MEMORY_UTILIZATION:-0.25}
      - TTS_ENFORCE_EAGER=${TTS_ENFORCE_EAGER:-1}
    command: uvicorn kotonoha.services._tts_server:app --host 0.0.0.0 --port 8004 --loop uvloop

  orchestrator:
    <<: *jetson
    build:
      context: ..
      dockerfile: docker/Dockerfile.orchestrator
      args:
        BASE_IMAGE: ${ORCH_BASE:-nvcr.io/nvidia/vllm:26.07-py3}
    depends_on: [asr, asr-verify, llm, tts]
    devices:
      - /dev/snd:/dev/snd # no browser microphone (§12); open the device directly
    group_add:
      - audio
    stdin_open: true
    tty: true
    command: python3 -m kotonoha._cli run
