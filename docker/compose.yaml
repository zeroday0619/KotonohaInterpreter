# Kotonoha — service split (§3)
#
# Two things matter here:
#   ipc: host          the shared-memory audio ring needs /dev/shm shared across
#                      process boundaries. Without it the audio would have to go
#                      into an HTTP body, costing 100-200 ms per turn.
#   network_mode: host  127.0.0.1:800x means the same thing inside and out.
#
# JetPack 7.2 allows Orin to run Arm64 SBSA containers. The selected NVIDIA
# r38.2 Ubuntu 24.04 image is shared as the CUDA 13 application base.

name: kotonohainterpreter

x-jetson: &jetson
  runtime: nvidia
  ipc: host
  network_mode: host
  restart: unless-stopped
  environment:
    - KOTONOHA_CONFIG=/app/config/default.yaml
    - HF_HOME=/models/hf
    - TRANSFORMERS_OFFLINE=1 # fully offline (§1); models are fetched in advance
    - HF_HUB_OFFLINE=1
  volumes:
    - ../:/app
    - ../models:/models
    - ../data:/app/data
  working_dir: /app

services:
  asr:
    <<: *jetson
    build:
      context: ..
      dockerfile: docker/Dockerfile.asr
      args:
        BASE_IMAGE: ${ASR_BASE:-ghcr.io/nvidia-ai-iot/vllm:r38.2.arm64-sbsa-cu130-24.04}
    command: uvicorn kotonoha.services._asr_server:app --host 0.0.0.0 --port 8001 --loop uvloop

  asr-verify:
    <<: *jetson
    build:
      context: ..
      dockerfile: docker/Dockerfile.asr-verify
      args:
        BASE_IMAGE: ${VERIFY_BASE:-ghcr.io/nvidia-ai-iot/vllm:r38.2.arm64-sbsa-cu130-24.04}
    command: uvicorn kotonoha.services._asr_verify_server:app --host 0.0.0.0 --port 8002 --loop uvloop

  llm:
    <<: *jetson
    image: ${LLM_IMAGE:-ghcr.io/nvidia-ai-iot/vllm:r38.2.arm64-sbsa-cu130-24.04}
    environment:
      - KOTONOHA_CONFIG=/app/config/default.yaml
      - HF_HOME=/models/hf
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1
      - LLM_PROFILE=${LLM_PROFILE:-dense}
      - LLM_MODELS_DIR=/models/llm
      - LLM_PORT=8003
      - LLM_MAX_MODEL_LEN=${LLM_MAX_MODEL_LEN:-2048}
      - LLM_GPU_MEMORY_UTILIZATION=${LLM_GPU_MEMORY_UTILIZATION:-0.55}
    entrypoint: ["bash", "/app/scripts/run_vllm_llm.sh"]

  tts:
    <<: *jetson
    build:
      context: ..
      dockerfile: docker/Dockerfile.tts
      args:
        BASE_IMAGE: ${TTS_BASE:-ghcr.io/nvidia-ai-iot/vllm:r38.2.arm64-sbsa-cu130-24.04}
    command: uvicorn kotonoha.services._tts_server:app --host 0.0.0.0 --port 8004 --loop uvloop

  orchestrator:
    <<: *jetson
    build:
      context: ..
      dockerfile: docker/Dockerfile.orchestrator
      args:
        BASE_IMAGE: ${ORCH_BASE:-ghcr.io/nvidia-ai-iot/vllm:r38.2.arm64-sbsa-cu130-24.04}
    depends_on: [asr, asr-verify, llm, tts]
    devices:
      - /dev/snd:/dev/snd # no browser microphone (§12); open the device directly
    group_add:
      - audio
    stdin_open: true
    tty: true
    command: python3 -m kotonoha._cli run
