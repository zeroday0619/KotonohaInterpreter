# Kotonoha — service split (§3)
#
# Two things matter here:
#   ipc: host          the shared-memory audio ring needs /dev/shm shared across
#                      process boundaries. Without it the audio would have to go
#                      into an HTTP body, costing 100-200 ms per turn.
#   network_mode: host  127.0.0.1:800x means the same thing inside and out.
#
# Base image tags are not bumped casually (§2). Pin to the r36.4.0 family and
# confirm the tags that actually exist on the device with jetson-containers'
# autotag, then record them in .env.

name: kotonohainterpreter

x-jetson: &jetson
  runtime: nvidia
  ipc: host
  network_mode: host
  restart: unless-stopped
  environment:
    - KOTONOHA_CONFIG=/app/config/default.yaml
    - HF_HOME=/models/hf
    - TRANSFORMERS_OFFLINE=1 # fully offline (§1); models are fetched in advance
    - HF_HUB_OFFLINE=1
  volumes:
    - ../:/app
    - ../models:/models
    - ../data:/app/data
  working_dir: /app

services:
  asr:
    <<: *jetson
    build:
      context: ..
      dockerfile: docker/Dockerfile.asr
      args:
        BASE_IMAGE: ${ASR_BASE:-dustynv/transformers:r36.4.0}
    command: uvicorn kotonoha.services.asr_server:app --host 0.0.0.0 --port 8001 --loop uvloop

  asr-verify:
    <<: *jetson
    build:
      context: ..
      dockerfile: docker/Dockerfile.asr-verify
      args:
        BASE_IMAGE: ${VERIFY_BASE:-dustynv/faster-whisper:r36.4.0}
    command: uvicorn kotonoha.services.asr_verify_server:app --host 0.0.0.0 --port 8002 --loop uvloop

  llm:
    <<: *jetson
    image: ${LLM_IMAGE:-dustynv/llama_cpp:r36.4.0}
    environment:
      - LLM_PROFILE=${LLM_PROFILE:-dense} # settled by the Spike 3 result
      - LLAMA_BIN=/opt/llama.cpp/build/bin
      - MODELS_DIR=/models/gguf
      - LLM_PORT=8003
    command: bash /app/scripts/run_llm.sh

  tts:
    <<: *jetson
    build:
      context: ..
      dockerfile: docker/Dockerfile.tts
      args:
        BASE_IMAGE: ${TTS_BASE:-dustynv/pytorch:r36.4.0}
    command: uvicorn kotonoha.services.tts_server:app --host 0.0.0.0 --port 8004 --loop uvloop

  orchestrator:
    <<: *jetson
    build:
      context: ..
      dockerfile: docker/Dockerfile.orchestrator
      args:
        BASE_IMAGE: ${ORCH_BASE:-dustynv/pytorch:r36.4.0}
    depends_on: [asr, asr-verify, llm, tts]
    devices:
      - /dev/snd:/dev/snd # no browser microphone (§12); open the device directly
    group_add:
      - audio
    stdin_open: true
    tty: true
    command: python3 -m kotonoha.cli run
