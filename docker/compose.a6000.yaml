# Runs the complete Web and model-service stack on an RTX A6000 host.
#
#   export KOTONOHA_SERVICE_TOKEN=$(openssl rand -hex 32)
#   docker compose -f docker/compose.yaml -f docker/compose.a6000.yaml up -d
#
# Host networking and IPC colocate the Web application and model services. Keep this
# box on a trusted network and leave KOTONOHA_SERVICE_TOKEN set — an open /transcribe
# is an open transcription endpoint for anyone who can route to it.

name: kotonohainterpreter

x-a6000: &a6000
  runtime: ${CONTAINER_RUNTIME:-nvidia}
  ipc: host
  network_mode: host
  restart: unless-stopped
  stop_grace_period: 45s
  environment:
    - KOTONOHA_SETTINGS_DATABASE=/app/data/kotonoha.db
    - KOTONOHA_INITIAL_HARDWARE_PROFILE=${ACCELERATOR_PROFILE:-nvidia.rtx.a6000}
    - KOTONOHA_SERVICE_TOKEN=${KOTONOHA_SERVICE_TOKEN:?set a token before starting}
    - HF_HOME=/models/hf
    - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
    - HF_HUB_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
  volumes:
    - ../config:/app/config:ro
    - ../data:/app/data
    - ${MODELS_DIR:-../models}:/models
  working_dir: /app
x-a6000-python-build: &a6000-python-build
  context: ..
  dockerfile: docker/Dockerfile.a6000
  args:
    BASE_IMAGE: ${SERVICE_BASE:-${ACCELERATOR_SERVICE_BASE:-pytorch/pytorch:2.6.0-cuda12.6-cudnn9-runtime}}

services:
  metrics:
    image: kotonohainterpreter-metrics
    build:
      <<: *a6000-python-build
      target: metrics
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      - KOTONOHA_SETTINGS_DATABASE=/app/data/kotonoha.db
      - KOTONOHA_INITIAL_HARDWARE_PROFILE=${ACCELERATOR_PROFILE:-nvidia.rtx.a6000}
      - KOTONOHA_SERVICE_TOKEN=${KOTONOHA_SERVICE_TOKEN:?set a token before starting}
      - KOTONOHA__TRANSPORT__TOKEN=${KOTONOHA_SERVICE_TOKEN:?set a token before starting}
      - HF_HOME=/models/hf
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data
    working_dir: /app
    network_mode: host
    depends_on: [asr, asr-verify, llm, tts]

  asr:
    <<: *a6000
    image: kotonohainterpreter-asr
    build:
      <<: *a6000-python-build
      target: asr
      args:
        ASR_BASE_IMAGE: ${ASR_BASE:-${ACCELERATOR_VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.07-py3}}
    environment:
      - KOTONOHA_SETTINGS_DATABASE=/app/data/kotonoha.db
      - KOTONOHA_INITIAL_HARDWARE_PROFILE=${ACCELERATOR_PROFILE:-nvidia.rtx.a6000}
      - KOTONOHA_SERVICE_TOKEN=${KOTONOHA_SERVICE_TOKEN:?set a token before starting}
      - HF_HOME=/models/hf
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - HF_HUB_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      # Voxtral Realtime does not support the full CUDA graph path.
      - VLLM_DISABLE_COMPILE_CACHE=1
    command: uvicorn kotonoha.services._asr_server:app --host 0.0.0.0 --port 8001 --loop uvloop --ws-max-size 4194304 --timeout-graceful-shutdown 30
    deploy:
      resources:
        reservations:
          devices:
            - driver: ${GPU_DRIVER:-nvidia}
              device_ids: ["${ASR_GPU_DEVICE:-0}"]
              capabilities: [gpu]

  asr-verify:
    <<: *a6000
    image: kotonohainterpreter-asr-verify
    build:
      <<: *a6000-python-build
      target: asr-verify
    depends_on: [asr]
    command: uvicorn kotonoha.services._asr_verify_server:app --host 0.0.0.0 --port 8002 --loop uvloop --ws-max-size 4194304 --timeout-graceful-shutdown 30
    deploy:
      resources:
        reservations:
          devices:
            - driver: ${GPU_DRIVER:-nvidia}
              device_ids: ["${ASR_VERIFY_GPU_DEVICE:-0}"]
              capabilities: [gpu]

  tts:
    <<: *a6000
    image: kotonohainterpreter-tts
    build:
      context: ..
      dockerfile: docker/Dockerfile.tts
      args:
        BASE_IMAGE: ${TTS_IMAGE:-${ACCELERATOR_OMNI_IMAGE:-vllm/vllm-omni:v0.26.0}}
        VLLM_NVML_PATCH: ${VLLM_NVML_PATCH:-0}
    depends_on: [asr]
    environment:
      - KOTONOHA_SERVICE_TOKEN=${KOTONOHA_SERVICE_TOKEN:?set a token before starting}
      - KOTONOHA_SETTINGS_DATABASE=/app/data/kotonoha.db
      - KOTONOHA_INITIAL_HARDWARE_PROFILE=${ACCELERATOR_PROFILE:-nvidia.rtx.a6000}
      - HF_HOME=/models/hf
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - HF_HUB_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
    command: uvicorn kotonoha.services._tts_server:app --host 0.0.0.0 --port 8004 --loop uvloop --ws-max-size 4194304 --timeout-graceful-shutdown 30
    deploy:
      resources:
        reservations:
          devices:
            - driver: ${GPU_DRIVER:-nvidia}
              device_ids: ["${TTS_GPU_DEVICE:-0}"]
              capabilities: [gpu]

  llm:
    <<: *a6000
    image: kotonohainterpreter-llm
    build:
      <<: *a6000-python-build
      target: llm
      args:
        LLM_BASE_IMAGE: ${LLM_IMAGE:-${ACCELERATOR_VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.07-py3}}
    environment:
      - KOTONOHA_SETTINGS_DATABASE=/app/data/kotonoha.db
      - KOTONOHA_INITIAL_HARDWARE_PROFILE=${ACCELERATOR_PROFILE:-nvidia.rtx.a6000}
      - KOTONOHA_SERVICE_TOKEN=${KOTONOHA_SERVICE_TOKEN:?set a token before starting}
      - HF_HOME=/models/hf
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - HF_HUB_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
    command: uvicorn kotonoha.services._llm_server:app --host 0.0.0.0 --port 8003 --loop uvloop --ws-max-size 4194304 --timeout-graceful-shutdown 30
    deploy:
      resources:
        reservations:
          devices:
            - driver: ${GPU_DRIVER:-nvidia}
              device_ids: ["${LLM_GPU_DEVICE:-0}"]
              capabilities: [gpu]
