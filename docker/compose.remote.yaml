# Runs ON the external RTX A6000 box, not on the Orin.
#
#   export KOTONOHA_SERVICE_TOKEN=$(openssl rand -hex 32)
#   docker compose -f docker/compose.remote.yaml up -d
#
# Then on the Orin, with the same token:
#   export KOTONOHA__REMOTE__TOKEN=<same value>
#   kotonoha -c config/performance.yaml netcheck
#   kotonoha -c config/performance.yaml run
#
# No ipc: host here. Shared memory does not cross machines, so these services
# receive audio through /transcribe/upload instead (transport.py).
#
# Ports are published on the host so the Orin can reach them. Keep this box on
# a trusted network and leave KOTONOHA_SERVICE_TOKEN set — an open /transcribe
# is an open transcription endpoint for anyone who can route to it.

name: kotonohainterpreter

x-a6000: &a6000
  restart: unless-stopped
  environment:
    - KOTONOHA_CONFIG=/app/config/remote-server.yaml
    - KOTONOHA_LOCAL_CONFIG=/app/config/remote-server.local.yaml
    - KOTONOHA_LLM_CONFIG_ENV=/app/config/remote-llm.env
    - KOTONOHA_SERVICE_TOKEN=${KOTONOHA_SERVICE_TOKEN:?set a token before starting}
    - HF_HOME=/models/hf
    - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
    - HF_HUB_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
  volumes:
    - ../:/app
    - ${MODELS_DIR:-../models}:/models
  working_dir: /app
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

x-a6000-python-build: &a6000-python-build
  context: ..
  dockerfile: docker/Dockerfile.remote
  args:
    BASE_IMAGE: ${REMOTE_BASE:-pytorch/pytorch:2.6.0-cuda12.6-cudnn9-runtime}

services:
  asr:
    <<: *a6000
    image: kotonohainterpreter-asr
    build:
      <<: *a6000-python-build
      target: asr
      args:
        ASR_BASE_IMAGE: ${REMOTE_ASR_BASE:-vllm/vllm-openai:v0.19.1}
    ports: ["8001:8001"]
    command: uvicorn kotonoha.services._asr_server:app --host 0.0.0.0 --port 8001 --loop uvloop

  asr-verify:
    <<: *a6000
    image: kotonohainterpreter-asr-verify
    build:
      <<: *a6000-python-build
      target: asr-verify
    depends_on: [asr]
    ports: ["8002:8002"]
    command: uvicorn kotonoha.services._asr_verify_server:app --host 0.0.0.0 --port 8002 --loop uvloop

  tts:
    <<: *a6000
    image: kotonohainterpreter-tts
    build:
      <<: *a6000-python-build
      target: tts
      args:
        BASE_IMAGE: ${REMOTE_BASE:-pytorch/pytorch:2.6.0-cuda12.6-cudnn9-runtime}
        TTS_BUILD_IMAGE: ${REMOTE_TTS_BUILD_BASE:-pytorch/pytorch:2.6.0-cuda12.6-cudnn9-devel}
    depends_on: [asr]
    ports: ["8004:8004"]
    command: uvicorn kotonoha.services._tts_server:app --host 0.0.0.0 --port 8004 --loop uvloop

  llm:
    <<: *a6000
    # llama.cpp with CUDA for x86. Pin a verified tag present on the host.
    image: ${LLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    ports: ["8003:8003"]
    environment:
      # The remote profile selects the 30B MoE at Q4_K_M. Deployment acceptance
      # measures residency and generation rate on the A6000.
      - LLM_PROFILE=${LLM_PROFILE:-moe}
      - LLAMA_BIN=/app
      - MODELS_DIR=/models/gguf
      - LLM_PORT=8003
      - LLM_CTX=${LLM_CTX:-4096}
      - KOTONOHA_LLM_CONFIG_ENV=/config/remote-llm.env
      # Current llama.cpp server builds load libllama-server-impl.so from /app.
      - LD_LIBRARY_PATH=/app
    volumes:
      # Mounting the repository at /app would hide the image's /app/llama-server binary.
      - ../scripts/run_llm.sh:/opt/kotonoha/run_llm.sh:ro
      - ../config:/config
      - ${MODELS_DIR:-../models}:/models
    entrypoint: ["bash", "/opt/kotonoha/run_llm.sh"]
