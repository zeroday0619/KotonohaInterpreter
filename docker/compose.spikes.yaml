# Isolated hardware spike containers for Jetson AGX Orin and RTX A6000 hosts.
# The host wrapper selects the target image and keeps all model access offline.

name: kotonoha-spikes

x-spike-runtime: &spike-runtime
  runtime: nvidia
  ipc: host
  network_mode: host
  restart: "no"
  # The vendor vLLM images install their Python environment under /opt/venv and
  # support root as their runtime user. The entrypoint wrapper returns generated
  # files to the invoking host user after each short-lived probe.
  user: "0:0"
  working_dir: /workspace
  environment:
    HOME: /tmp/kotonoha-spike
    HF_HOME: /models/hf
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    NVIDIA_VISIBLE_DEVICES: ${SPIKE_GPU_DEVICE:-all}
    KOTONOHA_SPIKE_IMAGE: ${SPIKE_VLLM_IMAGE:-ghcr.io/nvidia-ai-iot/vllm:r36.4.tegra-aarch64-cu126-22.04}
    SPIKE_GROUP_ID: ${SPIKE_GROUP_ID:-0}
    SPIKE_PYTHON: ${SPIKE_PYTHON:-python3}
    SPIKE_USER_ID: ${SPIKE_USER_ID:-0}
  volumes:
    - ../:/workspace
    - ${MODELS_DIR:-../models}:/models:ro

services:
  asr:
    <<: *spike-runtime
    image: ${SPIKE_VLLM_IMAGE:-ghcr.io/nvidia-ai-iot/vllm:r36.4.tegra-aarch64-cu126-22.04}
    entrypoint: ["bash", "spikes/container_entrypoint.sh", "spikes/spike1_asr_load.py"]

  tts:
    <<: *spike-runtime
    image: ${SPIKE_TTS_IMAGE:-kotonohainterpreter-tts}
    environment:
      HOME: /tmp/kotonoha-spike
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      NVIDIA_VISIBLE_DEVICES: ${SPIKE_GPU_DEVICE:-all}
      KOTONOHA_SPIKE_IMAGE: ${SPIKE_TTS_IMAGE:-kotonohainterpreter-tts}
      SPIKE_GROUP_ID: ${SPIKE_GROUP_ID:-0}
      SPIKE_PYTHON: ${SPIKE_PYTHON:-python3}
      SPIKE_USER_ID: ${SPIKE_USER_ID:-0}
    entrypoint: ["bash", "spikes/container_entrypoint.sh", "spikes/spike2_flash_attn.py"]

  llm:
    <<: *spike-runtime
    image: ${SPIKE_VLLM_IMAGE:-ghcr.io/nvidia-ai-iot/vllm:r36.4.tegra-aarch64-cu126-22.04}
    entrypoint: ["bash", "spikes/container_entrypoint.sh", "spikes/spike3_llm_tokrate.py"]

  report:
    <<: *spike-runtime
    image: ${SPIKE_VLLM_IMAGE:-ghcr.io/nvidia-ai-iot/vllm:r36.4.tegra-aarch64-cu126-22.04}
    entrypoint: ["bash", "spikes/container_entrypoint.sh", "spikes/report.py"]
